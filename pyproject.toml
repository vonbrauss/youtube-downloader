[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-downloader-desktop"
version = "0.1.1"
description = "Native macOS download manager for the system yt-dlp installation"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.10,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.16,<7", "Pillow>=12"]

[project.scripts]
youtube-downloader = "downloader.app:main"

[tool.setuptools.packages.find]
include = ["downloader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
